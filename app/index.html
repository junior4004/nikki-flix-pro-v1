
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKKIFLIX PRO 2026</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #landing { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .btn { background: #E50914; color: #fff; border: none; padding: 20px 50px; font-size: 1.5rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px #E50914; margin-top: 20px; }
        #main-ui { display: none; height: 100vh; flex-direction: column; }
        header { height: 60px; border-bottom: 2px solid #E50914; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; background: #080808; }
        .container { display: flex; flex: 1; }
        .sidebar { width: 80px; border-right: 1px solid #222; display: flex; flex-direction: column; align-items: center; padding-top: 20px; background: #050505; }
        .nav-icon { font-size: 30px; margin: 20px 0; cursor: pointer; background: none; border: none; color: #fff; opacity: 0.6; transition: 0.3s; }
        .nav-icon:hover { opacity: 1; color: #E50914; }
        #content { flex: 1; background: #111; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .room-padding { padding: 40px; }
        .stat-box { background: #222; padding: 5px 15px; border-radius: 5px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div id="landing">
    <div style="font-size: 100px; filter: drop-shadow(0 0 20px #E50914);">👩‍💼</div>
    <h1 style="color: #E50914; font-size: 3rem; letter-spacing: 3px;">NIKKIFLIX PRO 2026</h1>
    <p style="color: #666;">CASINO • THEATER • POKER • SOCIAL</p>
    <button class="btn" onclick="startSystem()">INITIALIZE SYSTEM</button>
</div>

<div id="main-ui">
    <header>
        <div style="color:#E50914; font-weight:900; font-size:26px; letter-spacing:2px;">NIKKIFLIX</div>
        <div style="display:flex; gap:15px; align-items:center;">
            <div class="stat-box" style="color:#FFD700;">GC: 50,000</div>
            <div class="stat-box" style="color:#00FA9A;">SC: 1.00 🔒</div>
            <div style="width:35px; height:35px; border-radius:50%; background:#E50914; border:2px solid #fff;"></div>
        </div>
    </header>
    <div class="container">
        <div class="sidebar">
            <button class="nav-icon" title="Theater" onclick="show('theater')">🎬</button>
            <button class="nav-icon" title="Casino" onclick="show('casino')">🎰</button>
            <button class="nav-icon" title="Poker" onclick="show('poker')">♠️</button>
            <button class="nav-icon" title="Social" onclick="show('social')">📻</button>
        </div>
        <div id="content">
            <div id="view-theater" class="room-padding">
                <h2 style="color:#E50914; border-left:4px solid #E50914; padding-left:15px;">PREMIUM THEATER</h2>
                <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:20px; margin-top:20px;">
                    <div style="height:280px; background:#222; border-radius:8px; display:flex; align-items:center; justify-content:center; border:1px solid #333;">MOVIE 1</div>
                    <div style="height:280px; background:#222; border-radius:8px; display:flex; align-items:center; justify-content:center; border:1px solid #333;">MOVIE 2</div>
                    <div style="height:280px; background:#222; border-radius:8px; display:flex; align-items:center; justify-content:center; border:1px solid #333;">MOVIE 3</div>
                </div>
            </div>
            
            <div id="view-casino" style="display:none; height:100%;">
                <iframe src="https://demogamesfree.pragmaticplay.net/gs2c/html5Game.do?extGame=1&symbol=vs20sugarrush&gname=Sugar%20Rush&jurisdiction=99&lang=en&cur=USD"></iframe>
            </div>

            <div id="view-poker" style="display:none;" class="room-padding">
                <h2 style="color:#E50914;">3D TALKING TABLES</h2>
                <div style="display:flex; gap:30px; margin-top:30px;">
                    <div style="flex:1; height:200px; background:radial-gradient(#004400, #002200); border:4px solid #555; border-radius:100px; display:flex; align-items:center; justify-content:center; font-weight:bold;">TEXAS HOLDEM</div>
                    <div style="flex:1; height:200px; background:radial-gradient(#004400, #002200); border:4px solid #555; border-radius:100px; display:flex; align-items:center; justify-content:center; font-weight:bold;">BLACKJACK</div>
                </div>
            </div>

            <div id="view-social" style="display:none;" class="room-padding">
                <h2 style="color:#E50914;">SOCIAL LOUNGE</h2>
                <div style="background:#000; border:1px solid #222; height:300px; padding:20px; border-radius:8px;">
                    <p style="color:#00FA9A;">[System]: Welcome Jerry. Automated play active.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function startSystem() {
        if ('speechSynthesis' in window) {
            const msg = new SpeechSynthesisUtterance("System Online. Hi Jerry, I'm Nicole. Access granted. All rooms are now active.");
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }
        document.getElementById('landing').style.display = 'none';
        document.getElementById('main-ui').style.display = 'flex';
    }

    function show(room) {
        const rooms = ['theater', 'casino', 'poker', 'social'];
        rooms.forEach(r => {
            document.getElementById('view-' + r).style.display = (r === room) ? 'block' : 'none';
        });
        // Special case for casino iframe height
        if(room === 'casino') {
            document.getElementById('view-casino').style.display = 'block';
        }
    }
</script>
</body>
</html>
