```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIKKIFLIX - The Grand Presentation</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
  #ui-layer { position: absolute; bottom: 40px; width: 100%; text-align: center; z-index: 100; pointer-events: none; }
  .speech-bubble { background: rgba(0,0,0,0.85); color: white; padding: 18px 28px; border-radius: 40px; border: 3px solid #fff; display: inline-block; font-size: 1.3rem; max-width: 70%; font-weight: bold; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
  #start-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 25px 50px; background: #E50914; color: white; border: none; border-radius: 60px; font-size: 1.2rem; font-weight: bold; cursor: pointer; z-index: 200; box-shadow: 0 0 30px #E50914; transition: 0.3s; }
  #start-btn:hover { transform: translate(-50%, -50%) scale(1.1); background: #ff0000; }
</style>
</head>
<body>

<button id="start-btn" onclick="beginShow()">INITIALIZE NIKKIFLIX PRESENTATION</button>

<div id="ui-layer">
  <div id="bubble" style="display:none;" class="speech-bubble">Initializing...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene, camera, renderer, clock;

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020202);
  camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 9);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const floorGeo = new THREE.PlaneGeometry(20, 10);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a0a05, roughness: 0.2, metalness: 0.4 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  const curtainGeo = new THREE.PlaneGeometry(25, 12);
  const curtainMat = new THREE.MeshStandardMaterial({ color: 0x600000 });
  const curtain = new THREE.Mesh(curtainGeo, curtainMat);
  curtain.position.set(0, 6, -5);
  scene.add(curtain);

  const spot1 = new THREE.SpotLight(0xffffff, 800);
  spot1.position.set(-5, 12, 5);
  scene.add(spot1);

  const spot2 = new THREE.SpotLight(0xffffff, 800);
  spot2.position.set(5, 12, 5);
  scene.add(spot2);

  scene.add(new THREE.AmbientLight(0xffffff, 0.4));

  clock = new THREE.Clock();
  animate();
}

const script = [
  { name: "Nicole", text: "Hi! I'm Nicole.", pitch: 0.9, color: "#E50914" },
  { name: "Promise", text: "And I'm Promise!", pitch: 1.3, color: "#00FA9A" },
  { name: "Together", text: "And we are the faces of NIKKIFLIX!", pitch: 1.0, color: "#ffffff" },
  { name: "Nicole", text: "Welcome to the future of entertainment. Let's go over the Roadhouse Rules.", pitch: 0.9, color: "#E50914" },
  { name: "Promise", text: "Rule number one: Watch one ad at the start, and the rest of the night is YOURS!", pitch: 1.3, color: "#00FA9A" },
  { name: "Nicole", text: "Exactly. No interruptions while you're at the tables or watching a premiere.", pitch: 0.9, color: "#E50914" },
  { name: "Promise", text: "And don't forget—The Promised Land has the highest playthrough rates for our high rollers!", pitch: 1.3, color: "#00FA9A" },
  { name: "Together", text: "Let's get started!", pitch: 1.0, color: "#ffffff" }
];

let lineIndex = 0;

function speakLine() {
  if (lineIndex >= script.length) {
    document.getElementById('bubble').style.display = 'none';
    return;
  }

  const line = script[lineIndex];
  const bubble = document.getElementById('bubble');
  bubble.style.display = 'inline-block';
  bubble.innerText = line.name + ": " + line.text;
  bubble.style.borderColor = line.color;

  const utter = new SpeechSynthesisUtterance(line.text);
  utter.pitch = line.pitch;
  utter.rate = 0.95;
  
  utter.onend = () => {
    lineIndex++;
    setTimeout(speakLine, 600);
  };

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

function beginShow() {
  document.getElementById('start-btn').style.display = 'none';
  window.speechSynthesis.cancel();
  speakLine();
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
</script>
</body>
</html>
